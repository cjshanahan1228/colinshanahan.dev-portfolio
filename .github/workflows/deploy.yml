# deploy-site    → /site (case studies pre-rendered to HTML first) + /api (managed functions) to Azure Static Web Apps (token-based)
# publish-resume → /resume to private Blob Storage via GitHub OIDC (no stored secrets)
#                  visitors get access via the gated request/approval flow in /api
#
# Prereqs (values from `terraform output` in infra/):
#   Secret:    SWA_DEPLOYMENT_TOKEN
#   Variables: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID

name: Deploy portfolio

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/scripts/prerender-case-studies.mjs"
      - "api/**"
      - "resume/**"
  workflow_dispatch:

# Least privilege: the default token is read-only; only the OIDC job below is
# granted id-token (it is not needed to push to Static Web Apps).
permissions:
  contents: read

# One deploy at a time, never cancel a deploy mid-flight: two quick merges used
# to race each other. The newest queued run wins.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    name: Deploy site to Static Web Apps
    # workflow_dispatch can be started from any branch; only main may ship.
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
      # Owner-input placeholders (TODO(colin)) must never ship: strict mode fails
      # on any left in site/, the resume source, or the generated DOCX.
      - name: Block unfilled TODO(colin) placeholders
        run: node .github/scripts/check-site.mjs --strict
      # Bake the case studies (source of truth: site/case-studies.js) into the
      # static HTML so crawlers and link previews see them without running JS.
      # The deploy below uploads site/ as-is (skip_app_build), so this step's
      # output is exactly what ships.
      - name: Pre-render case studies
        run: node .github/scripts/prerender-case-studies.mjs
      - name: Deploy
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: site
          api_location: api
          skip_app_build: true

  publish-resume:
    runs-on: ubuntu-latest
    name: Publish resume to Blob Storage (OIDC)
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 10
    permissions:
      id-token: write # request the OIDC token for azure/login
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Owner-input placeholders (TODO(colin)) must never ship: strict mode fails
      # on any left in site/, the resume source, or the generated DOCX.
      - name: Block unfilled TODO(colin) placeholders
        run: node .github/scripts/check-site.mjs --strict
      - name: Azure login via OIDC federation
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          # The CI identity is scoped to the resume container only, so it cannot
          # list the subscription; storage calls below use --auth-mode login.
          allow-no-subscriptions: true
      - name: Upload resume PDF
        run: |
          az storage blob upload \
            --account-name stcolinshanahanresume \
            --container-name resume \
            --name Colin-Shanahan-Resume.pdf \
            --file resume/Colin-Shanahan-Resume.pdf \
            --content-type application/pdf \
            --auth-mode login --overwrite
      - name: Upload resume DOCX
        run: |
          az storage blob upload \
            --account-name stcolinshanahanresume \
            --container-name resume \
            --name Colin-Shanahan-Resume.docx \
            --file resume/Colin-Shanahan-Resume.docx \
            --content-type application/vnd.openxmlformats-officedocument.wordprocessingml.document \
            --auth-mode login --overwrite
