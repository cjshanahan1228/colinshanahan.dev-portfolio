# Blocks PRs that add dependencies with known high/critical vulnerabilities.
# Needs the repository's "Dependency graph" enabled (Settings → Code security);
# until it is, the action errors out, so the step is advisory (continue-on-error).
# Remove continue-on-error once the graph is on.

name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          fail-on-severity: high
