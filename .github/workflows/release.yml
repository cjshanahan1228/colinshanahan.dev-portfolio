# Auto-versioning: every merge to main computes the next semver from
# conventional commit titles (feat → minor, fix → patch, BREAKING CHANGE /
# ! → major), pushes the tag, and publishes a GitHub Release with notes.
#
# PR titles become the squash commit, so writing "feat: ..." on the PR is
# all it takes — no manual version bookkeeping.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write # push the tag + create the release; nothing else

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the bump is computed from commits since the last tag

      - name: Compute next version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@af99e60ce8132224b8e6ebab5023449fe256ed46 # v7.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          tag_prefix: v

      - name: Publish GitHub Release
        if: steps.tag.outputs.new_tag
        # Step outputs go through env, never straight into the script text.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$NEW_TAG" \
            --repo "$REPO" \
            --title "$NEW_TAG" \
            --generate-notes
