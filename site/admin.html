<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Resume requests — admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/theme.css">
<script src="/theme.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sans);background:var(--mist);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
  a{color:var(--azure);text-decoration:none}
  a:hover{text-decoration:underline}
  .wrap{max-width:900px;margin:0 auto;padding:0 24px}
  header{padding:56px 0 8px}
  .crumb{font-family:var(--mono);font-size:.72rem;color:var(--slate);margin-bottom:14px}
  h1{font-family:var(--display);font-size:clamp(1.8rem,4vw,2.4rem);font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--slate);max-width:60ch;margin-top:10px;font-size:.95rem}

  .counts{display:flex;flex-wrap:wrap;gap:10px;margin:26px 0 18px;font-family:var(--mono);font-size:.72rem}
  .count{background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:5px 14px;color:var(--slate)}
  .count b{color:var(--ink);font-family:var(--display);font-size:.9rem}

  .req{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-bottom:14px}
  .req-top{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px}
  .req .who{font-family:var(--display);font-size:1.05rem;font-weight:600}
  .req .co{color:var(--slate);font-size:.9rem}
  .req .when{font-family:var(--mono);font-size:.7rem;color:var(--slate);margin-left:auto}
  .req .mail{font-family:var(--mono);font-size:.8rem;margin-top:4px;display:block}
  .req .note{margin-top:12px;padding:12px 14px;background:var(--mist);border-radius:8px;font-size:.9rem;color:var(--body);white-space:pre-wrap}
  .badge{font-family:var(--mono);font-size:.66rem;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em}
  .badge.pending{background:var(--azure-soft);color:var(--azure)}
  .badge.approved{background:var(--deploy-soft);color:var(--deploy)}
  .badge.denied{background:var(--down-soft);color:var(--down)}

  .actions{display:flex;gap:10px;margin-top:16px}
  .act{font-family:var(--mono);font-size:.76rem;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:border-color .15s}
  .act:hover:not(:disabled){border-color:var(--azure)}
  .act.approve{background:var(--azure);border-color:var(--azure);color:#fff}
  .act.approve:hover:not(:disabled){background:var(--azure-deep)}
  .act:disabled{opacity:.55;cursor:default}

  .msg{font-family:var(--mono);font-size:.78rem;color:var(--slate);margin-top:10px}
  .err{background:var(--down-soft);color:var(--down);border:1px solid var(--down-line);border-radius:12px;padding:18px 22px;font-size:.9rem}
  .skel{color:var(--slate);font-family:var(--mono);font-size:.8rem}
  .note-foot{font-family:var(--mono);font-size:.7rem;color:var(--slate);margin:30px 0 60px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="crumb"><a href="/">← colinshanahan.dev</a> / admin</div>
    <h1>Resume requests</h1>
    <p class="sub">Every request stored in Table Storage. Approving emails the requester a 7-day signed link; denying closes the request silently and sends nothing.</p>
  </header>

  <div id="app"><p class="skel">loading requests ...</p></div>

  <p class="note-foot">
    gated behind Static Web Apps authentication · this page is noindex ·
    <a href="/.auth/logout?post_logout_redirect_uri=/">sign out</a>
  </p>
</div>

<script>
const app = document.getElementById("app");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

function fmtAgo(iso) {
  if (!iso) return "–";
  const mins = Math.floor((Date.now() - new Date(iso)) / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return mins + "m ago";
  const h = Math.floor(mins / 60);
  if (h < 24) return h + "h ago";
  return Math.floor(h / 24) + "d ago";
}

function card(r) {
  const pending = r.status === "pending";
  return `
    <div class="req" data-id="${esc(r.id)}">
      <div class="req-top">
        <span class="who">${esc(r.name)}</span>
        ${r.company ? `<span class="co">${esc(r.company)}</span>` : ""}
        <span class="badge ${esc(r.status)}">${esc(r.status)}</span>
        <span class="when">${fmtAgo(r.createdAt)}${r.decidedAt ? " · decided " + fmtAgo(r.decidedAt) : ""}</span>
      </div>
      <a class="mail" href="mailto:${esc(r.email)}">${esc(r.email)}</a>
      ${r.note ? `<div class="note">${esc(r.note)}</div>` : ""}
      ${pending ? `
        <div class="actions">
          <button class="act approve" data-action="approve" data-token="${esc(r.token)}">Approve — send links</button>
          <button class="act" data-action="deny" data-token="${esc(r.token)}">Deny</button>
        </div>
        <p class="msg" hidden></p>` : ""}
    </div>`;
}

async function decide(btn) {
  const row = btn.closest(".req");
  const msg = row.querySelector(".msg");
  const buttons = row.querySelectorAll(".act");
  buttons.forEach(b => (b.disabled = true));
  msg.hidden = false;
  msg.textContent = btn.dataset.action === "approve" ? "sending links ..." : "closing request ...";

  const url = `/api/resume-decision?id=${encodeURIComponent(row.dataset.id)}`
            + `&token=${encodeURIComponent(btn.dataset.token)}`
            + `&action=${encodeURIComponent(btn.dataset.action)}`;
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error(res.status);
    msg.textContent = btn.dataset.action === "approve" ? "approved — links sent" : "denied";
    load();
  } catch {
    msg.textContent = "that failed — try the link in the notification email";
    buttons.forEach(b => (b.disabled = false));
  }
}

async function load() {
  try {
    const res = await fetch("/api/resume-admin", { headers: { Accept: "application/json" } });
    if (res.status === 401 || res.status === 403) {
      app.innerHTML = `<div class="err">Signed in, but not as the configured admin.
        <a href="/.auth/logout?post_logout_redirect_uri=/admin">Sign out and try again</a>.</div>`;
      return;
    }
    if (!res.ok) throw new Error(res.status);
    const d = await res.json();

    const c = d.counts || {};
    const counts = `<div class="counts">
      <span class="count"><b>${c.pending || 0}</b> pending</span>
      <span class="count"><b>${c.approved || 0}</b> approved</span>
      <span class="count"><b>${c.denied || 0}</b> denied</span>
    </div>`;

    app.innerHTML = counts + (d.requests.length
      ? d.requests.map(card).join("")
      : '<p class="skel">no requests yet</p>');

    app.querySelectorAll(".act").forEach(b =>
      b.addEventListener("click", () => decide(b)));
  } catch {
    app.innerHTML = '<div class="err">Could not load requests. The API may still be provisioning — check that infra has been applied.</div>';
  }
}

load();
</script>
</body>
</html>
